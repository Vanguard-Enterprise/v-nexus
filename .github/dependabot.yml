version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The server downcasts axum's WebSocket errors to `tungstenite::Error`, so the
      # direct dependency must stay on the version axum uses. Bump it with axum.
      - dependency-name: tungstenite

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
