# Vanguard Nexus server configuration.
# Copy to vn.yaml (or point --config / VN_CONFIG at it). Unknown fields are rejected.

# Schema version of this file. Only version 1 is supported.
version: 1

server:
  # Address and port the HTTP server binds to.
  listen: 0.0.0.0:8080
  # Built web UI (web/dist after `pnpm build`). Relative paths resolve against the
  # working directory. Optional: if unset or missing on disk, UI routes return 404.
  static_dir: web/dist
  # Reverse proxies whose X-Forwarded-For header VN believes, as addresses or CIDR
  # networks. Optional, defaults to none, in which case the TCP peer is the client
  # address used for rate limiting and audit records. List your ingress or proxy here
  # when one fronts VN.
  trusted_proxies: []

database:
  # Name of the environment variable that holds the PostgreSQL connection URL.
  # The URL itself never goes in this file and is never logged.
  url_env: VN_DATABASE_URL
  # Maximum pooled connections. Optional, defaults to 10.
  max_connections: 10

# User sign-in through an OpenID Connect provider such as Pocket ID. Optional: without
# this section nobody can sign in, and every API route except /api/v1/health answers 401.
# docs/development.md ("Configure sign-in") walks through setting up Pocket ID.
auth:
  # Issuer URL exactly as the provider reports it (a trailing slash matters).
  issuer_url: https://id.example.com
  # Client ID of a confidential (non-public) OIDC client using the authorization code
  # flow with PKCE. Pocket ID shows it after you create the client.
  client_id: "00000000-0000-0000-0000-000000000000"
  # Name of the environment variable that holds the client secret. The secret itself
  # never goes in this file and is never logged. Optional: leave it out for a public
  # client, which authenticates the code exchange with PKCE alone.
  client_secret_env: VN_OIDC_CLIENT_SECRET
  # Origin browsers use to reach VN. Register <public_url>/api/v1/auth/callback as the
  # redirect URI. With the Vite dev server, use its address, for example
  # http://<host>:5173. Cookies are marked Secure when this uses https.
  public_url: http://localhost:5173
  # Allow http for `issuer_url` and `public_url`. Optional, defaults to false, in which
  # case both must use https. Set it only for development over a trusted network
  # (loopback, or a VPN such as NetBird): over http, provider metadata and signing keys
  # can be tampered with in transit, and session cookies are sent without the Secure
  # flag. The example needs it because `public_url` above uses http.
  allow_insecure_http: true
  # Scopes requested at sign-in. Optional, defaults to [openid, profile, email]. Add
  # any scope your provider needs to release the admin claim: Pocket ID includes the
  # `groups` claim only when the `groups` scope is requested.
  scopes: [openid, profile, email, groups]
  # Users whose `claim` contains any of `values` get the installation admin role at
  # sign-in. The claim is read from the ID token, or from the userinfo response when
  # the ID token lacks it. It may be a string, a list (a groups claim), or an object
  # keyed by role name (some providers' project roles claims). Pocket ID reports the
  # names of the user's groups in the `groups` list claim. `claim: sub` instead lists
  # subjects in `values`, which is a way to name the first admin. Other standard
  # claims, such as `email` or `preferred_username`, are rejected because users can
  # often change them. Changes at the provider apply at the user's next sign-in.
  # Removing the role at the provider does not end existing sessions: each keeps the
  # admin role it was issued with until it is signed out or reaches its idle or
  # absolute timeout. Keep `absolute_timeout_minutes` short where that matters.
  admin:
    claim: groups
    values: [vn-admins]
  # Optional session lifetime in minutes. Defaults: 60 idle, 720 (12 hours) absolute.
  session:
    idle_timeout_minutes: 60
    absolute_timeout_minutes: 720

# Agent connections. Optional: without this section agents can still enroll, but the
# agent challenge, session, and connect endpoints answer 503, so no agent can connect.
agents:
  # Name of the environment variable that holds the challenge key: base64 of 32 to 64
  # random bytes, for example from `openssl rand -base64 32`. VN keys the MAC of its
  # stateless session challenges with it. Every server replica needs the same key.
  # Changing it invalidates only challenges that are still outstanding. The key itself
  # never goes in this file and is never logged.
  challenge_key_env: VN_AGENT_CHALLENGE_KEY
